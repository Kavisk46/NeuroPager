# Local development environment for NeuroPager.
#
# Usage: docker compose -f docker/docker-compose.yml up

services:
  neuropager-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: neuropager:dev
    container_name: neuropager-dev
    volumes:
      - ../:/workspace
    working_dir: /workspace
    environment:
      - PYTHONPATH=/workspace/src
      - NEUROPAGER_CONFIG_PATH=/workspace/configs/config.yaml
      - NEUROPAGER_LOGGING_CONFIG_PATH=/workspace/configs/logging.yaml
    command: ["bash"]
    stdin_open: true
    tty: true

  # Placeholder service for a future external vector store backend
  # (e.g., Qdrant, Weaviate, Milvus). Not wired up yet — scaffold only.
